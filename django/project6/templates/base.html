{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digitalecture Blog</title>
  <!-- Google Fonts: Plus Jakarta Sans for premium typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="{% static 'css/base.css' %}" rel="stylesheet">
</head>
<body>
  <div class="scroll-progress" id="scroll-progress-bar"></div>

  <div class="app-container">
    <header class="main-header">
      <div class="header-content">
        <h1 class="logo"><a href="{% url 'home' %}">Digitalecture <span class="logo-accent">Blog</span></a></h1>
        
        <div class="search-container">
          <input type="text" id="search-input" placeholder="Search blog posts..." autocomplete="off">
          <div id="search-results-dropdown" class="search-dropdown"></div>
        </div>

        <div class="header-meta">
          {% if user.is_authenticated %}
            <span class="user-badge">Hi, <strong>{{ user.username }}</strong></span>
            <a href="{% url 'admin:index' %}" class="btn-admin">Admin Dashboard</a>
          {% else %}
            <a href="{% url 'admin:index' %}" class="btn-admin-login">Log In</a>
          {% endif %}
        </div>
      </div>
    </header>

    <main class="main-content">
      {% block content %}
      {% endblock content %}
    </main>

    <footer class="main-footer">
      <p>&copy; 2026 Digitalecture. Built with Django &amp; Premium Aesthetics.</p>
    </footer>
  </div>

  <script>
    // Smooth scroll indicator at the top
    window.addEventListener("scroll", () => {
      const scrollProgress = document.getElementById("scroll-progress-bar");
      const scrollTop = window.scrollY || document.documentElement.scrollTop;
      const scrollHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
      const progressPercent = scrollHeight > 0 ? (scrollTop / scrollHeight) * 100 : 0;
      scrollProgress.style.width = progressPercent + "%";
    });

    // Search Autocomplete Logic
    const searchInput = document.getElementById("search-input");
    const searchResultsDropdown = document.getElementById("search-results-dropdown");

    if (searchInput && searchResultsDropdown) {
      searchInput.addEventListener("input", function() {
        const query = searchInput.value.trim();
        if (query.length < 2) {
          searchResultsDropdown.style.display = "none";
          searchResultsDropdown.innerHTML = "";
          return;
        }

        fetch(`/search/autocomplete/?q=${encodeURIComponent(query)}`)
          .then(response => {
            if (!response.ok) {
              throw new Error("Search failed");
            }
            return response.json();
          })
          .then(data => {
            if (data.results && data.results.length > 0) {
              searchResultsDropdown.innerHTML = data.results.map(post => `
                <a href="${post.url}" class="search-result-item">
                  <span class="search-result-title">${post.title}</span>
                </a>
              `).join('');
              searchResultsDropdown.style.display = "block";
            } else {
              searchResultsDropdown.innerHTML = '<div class="search-no-results">No posts found</div>';
              searchResultsDropdown.style.display = "block";
            }
          })
          .catch(err => {
            console.error("Autocomplete error:", err);
          });
      });

      // Hide dropdown on click outside
      document.addEventListener("click", function(event) {
        if (!searchInput.contains(event.target) && !searchResultsDropdown.contains(event.target)) {
          searchResultsDropdown.style.display = "none";
        }
      });
    }
  </script>
</body>
</html>
